<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Céline Laruelle</title>
<link rel="stylesheet" href="assets/style.css?v=V21">
</head>
<body>
<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="brand">Céline Laruelle</a>
    <a href="index.html" class="btn-home">← Accueil</a>
  </div>
</nav>

<section>
  <div class="container">
    <div class="form-box">
      <h2 class="text-center">Espace membres</h2>
      <p class="small-muted text-center">Connecte-toi avec ton identifiant et ton mot de passe.</p>
      <div id="alerte" class="alert alert-error hidden"></div>
      <label for="identifiant">Identifiant <span class="req">*</span></label>
      <input type="text" id="identifiant" autocomplete="username">
      <label for="motdepasse">Mot de passe <span class="req">*</span></label>
      <div class="password-wrap">
        <input type="password" id="motdepasse" autocomplete="current-password">
        <button type="button" class="toggle-eye" onclick="togglePw('motdepasse', this)" aria-label="Afficher le mot de passe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <p class="note-obligatoire"><span class="req">*</span> Champs obligatoires</p>
      <button class="btn mt-24" style="width:100%;" id="btnConnexion">Se connecter</button>
      <p class="small-muted text-center mt-24">Pas encore de compte ? <a href="inscription.html">Faire une demande d'accompagnement</a></p>
    </div>

    <div class="form-box mt-24">
      <h2 class="text-center">Pas encore membre ?</h2>
      <p class="text-center" style="font-weight:500;">Devenez membre !</p>
      <div id="alerteMini" class="alert alert-error hidden"></div>
      <div id="succesMini" class="alert alert-ok hidden"></div>
      <div id="formulaireMini">
        <label>Nom <span class="req">*</span></label><input type="text" id="mini_nom">
        <label>Prénom <span class="req">*</span></label><input type="text" id="mini_prenom">
        <label>GSM <span class="req">*</span></label><input type="tel" id="mini_gsm">
        <label>Email <span class="req">*</span></label><input type="email" id="mini_email">
        <p class="note-obligatoire"><span class="req">*</span> Champs obligatoires</p>
        <button class="btn mt-24" style="width:100%;" id="btnDevenirMembre">Devenir membre</button>
      </div>
    </div>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/auth.js"></script>
<script>
document.getElementById('btnConnexion').addEventListener('click', () => {
  const id = document.getElementById('identifiant').value;
  const mdp = document.getElementById('motdepasse').value;
  connecter(id, mdp, 'alerte', (data) => {
    if(data.role === 'superadmin') window.location.href = 'super.html';
    else if(data.role === 'admin') window.location.href = 'admin.html';
    else if(data.role === 'membre') window.location.href = 'membre.html';
    else afficherAlerte('alerte', "Rôle inconnu pour ce compte. Contacte Hélène.");
  });
});
document.getElementById('motdepasse').addEventListener('keydown', e => {
  if(e.key === 'Enter') document.getElementById('btnConnexion').click();
});

document.getElementById('btnDevenirMembre').addEventListener('click', async () => {
  masquerAlerte('alerteMini');
  const nom = document.getElementById('mini_nom').value.trim();
  const prenom = document.getElementById('mini_prenom').value.trim();
  const telephone = document.getElementById('mini_gsm').value.trim();
  const email = document.getElementById('mini_email').value.trim();

  if(!nom || !prenom || !telephone || !email){
    afficherAlerte('alerteMini', "Merci de remplir tous les champs.");
    return;
  }

  const btn = document.getElementById('btnDevenirMembre');
  btn.disabled = true; btn.textContent = 'Envoi en cours...';

  try{
    await db.collection('demandes_inscription').add({
      nom, prenom, email, telephone, raison: '', username: '', motdepasse: '',
      statut: 'en_attente',
      dateCreation: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('formulaireMini').classList.add('hidden');
    afficherAlerte('succesMini', "Merci ! Céline reviendra vers toi pour activer ton accès membre.", 'ok');
    document.getElementById('succesMini').classList.remove('hidden');
  }catch(err){
    afficherAlerte('alerteMini', traduireErreur(err));
    btn.disabled = false; btn.textContent = 'Devenir membre';
  }
});
</script>
</body>
</html>
